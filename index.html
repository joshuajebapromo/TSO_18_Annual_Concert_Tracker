<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeless 2026 — Concert Ops Tracker</title>
<style>
  :root{
    --navy:#1B1F3B; --navy2:#252B4D; --gold:#C9A227; --goldlt:#E6C866;
    --ivory:#F7F5F0; --card:#FFFFFF; --border:#E5E3DC; --text:#1B1F3B; --muted:#6B6F8A;
    --red:#D64545; --amber:#C9862A; --green:#2E8B57;
    --st-notstarted-bg:#EFEFEF; --st-notstarted-fg:#6B6F8A;
    --st-inprogress-bg:#FDECC8; --st-inprogress-fg:#92600E;
    --st-underreview-bg:#DCE6F7; --st-underreview-fg:#1E3F8A;
    --st-completed-bg:#DCF3E4; --st-completed-fg:#1D6B41;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--ivory);color:var(--text);}
  header.top{background:var(--navy);color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  header.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px;}
  header.top .sub{font-size:12px;color:var(--goldlt);margin-top:2px;}
  .top-actions{display:flex;align-items:center;gap:10px;}
  .btn{border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s;}
  .btn:hover{opacity:.85;}
  .btn-gold{background:var(--gold);color:var(--navy);}
  .btn-ghost{background:rgba(255,255,255,.12);color:#fff;}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-danger{background:#FBE4E4;color:var(--red);}
  .sync-note{font-size:11px;color:#C7CAE0;}
  .identity-pill{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:14px;padding:6px 12px;font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .identity-pill:hover{background:rgba(255,255,255,.2);}
  .identity-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}

  nav.tabs{display:flex;gap:4px;padding:14px 28px 0;background:var(--ivory);border-bottom:1px solid var(--border);}
  nav.tabs button{background:none;border:none;padding:10px 18px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;}
  nav.tabs button.active{color:var(--navy);border-bottom-color:var(--gold);}

  main{padding:20px 28px 60px;max-width:1400px;margin:0 auto;}

  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
  .kpi-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
  .kpi-card .num{font-size:24px;font-weight:800;color:var(--navy);}
  .kpi-card .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
  .kpi-card.overdue .num{color:var(--red);}
  .kpi-card.soon .num{color:var(--amber);}
  .kpi-card.done .num{color:var(--green);}

  .filter-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:16px;}
  .filter-bar label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-right:4px;}
  .filter-bar select,.filter-bar input[type=date]{border:1px solid var(--border);border-radius:7px;padding:6px 9px;font-size:12.5px;font-family:inherit;}
  .filter-group{display:flex;align-items:center;gap:4px;}
  .filter-count{margin-left:auto;font-size:11.5px;color:var(--muted);}

  .dept-section{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden;}
  .dept-head{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;}
  .dept-head .dept-name{font-weight:700;font-size:14px;}
  .dept-head .dept-count{font-size:11px;color:var(--muted);font-weight:500;}
  .dept-progress-wrap{flex:1;max-width:220px;display:flex;align-items:center;gap:8px;}
  .dept-progress-bar{flex:1;height:7px;background:#EDEBE3;border-radius:6px;overflow:hidden;}
  .dept-progress-fill{height:100%;background:var(--green);}
  .dept-progress-pct{font-size:11px;font-weight:700;color:var(--muted);width:34px;text-align:right;}
  .dept-caret{transition:transform .15s;color:var(--muted);font-size:12px;}
  .dept-section.collapsed .dept-caret{transform:rotate(-90deg);}
  .dept-body{border-top:1px solid var(--border);}
  .dept-section.collapsed .dept-body{display:none;}

  table.task-table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;}
  table.task-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--border);background:#FBFAF6;}
  table.task-table td{padding:9px 12px;border-bottom:1px solid #F0EEE7;vertical-align:middle;overflow-wrap:break-word;}
  table.task-table tr:last-child td{border-bottom:none;}
  /* Fixed, identical column widths across every department table so they all line up */
  table.task-table th:nth-child(1), table.task-table td:nth-child(1){width:32%;}
  table.task-table th:nth-child(2), table.task-table td:nth-child(2){width:20%;}
  table.task-table th:nth-child(3), table.task-table td:nth-child(3){width:18%;}
  table.task-table th:nth-child(4), table.task-table td:nth-child(4){width:20%;}
  table.task-table th:nth-child(5), table.task-table td:nth-child(5){width:10%;}
  table.task-table tr.overdue td.task-cell{border-left:3px solid var(--red);}
  table.task-table tr.soon td.task-cell{border-left:3px solid var(--amber);}
  .task-cell{padding-left:12px;}
  .task-name{font-weight:600;}
  .task-tag{font-size:10.5px;color:var(--muted);}
  .date-range{font-size:12px;white-space:nowrap;}
  .date-flag{font-size:10.5px;font-weight:700;margin-left:6px;}
  .date-flag.overdue{color:var(--red);}
  .date-flag.soon{color:var(--amber);}
  .pic-cell{font-size:12.5px;}
  .overseer-note{font-size:10.5px;color:var(--muted);margin-top:2px;}
  .overseer-note b{color:var(--text);}

  select.status-pill{border:none;border-radius:14px;padding:5px 10px 5px 8px;font-size:12px;font-weight:700;cursor:pointer;appearance:none;-webkit-appearance:none;background-repeat:no-repeat;background-position:right 6px center;padding-right:22px;}
  select.status-pill:disabled{cursor:not-allowed;opacity:.7;}
  .st-Not_Started{background-color:var(--st-notstarted-bg);color:var(--st-notstarted-fg);}
  .st-In_Progress{background-color:var(--st-inprogress-bg);color:var(--st-inprogress-fg);}
  .st-Under_Review{background-color:var(--st-underreview-bg);color:var(--st-underreview-fg);}
  .st-Completed{background-color:var(--st-completed-bg);color:var(--st-completed-fg);}

  .row-actions{display:flex;gap:6px;}
  .icon-btn{background:none;border:none;cursor:pointer;font-size:14px;padding:4px 6px;border-radius:6px;color:var(--muted);}
  .icon-btn:hover{background:#F0EEE7;color:var(--text);}

  /* Calendar */
  .cal-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .cal-toolbar .cal-month-label{font-size:16px;font-weight:700;color:var(--navy);min-width:170px;}
  .cal-nav-btn{background:var(--card);border:1px solid var(--border);border-radius:7px;width:32px;height:32px;cursor:pointer;font-size:14px;color:var(--navy);}
  .cal-nav-btn:hover{background:#F0EEE7;}
  .timeline-legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .legend-chip{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}
  .legend-swatch{width:11px;height:11px;border-radius:3px;}
  .cal-grid{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .cal-weekday-row{display:grid;grid-template-columns:repeat(7,1fr);background:var(--navy);}
  .cal-weekday-row div{color:#fff;font-size:11px;font-weight:700;text-align:center;padding:8px 0;}
  .cal-week{position:relative;display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--border);min-height:130px;}
  .cal-day{border-right:1px solid var(--border);padding:4px 4px 2px;position:relative;}
  .cal-day:last-child{border-right:none;}
  .cal-day.other-month{background:#FAFAF6;}
  .cal-daynum{font-size:11px;color:var(--muted);font-weight:600;}
  .cal-day.today .cal-daynum{background:var(--gold);color:var(--navy);border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;}
  .cal-bars-overlay{position:absolute;top:20px;left:0;right:0;bottom:2px;pointer-events:none;}
  .cal-bar{position:absolute;height:28px;border-radius:4px;padding:2px 6px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:1px;overflow:hidden;cursor:pointer;pointer-events:auto;box-shadow:0 0 0 1px rgba(0,0,0,.04);}
  .cal-bar .cb-line1{font-size:9.5px;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:flex;align-items:center;}
  .cal-bar .cb-line2{font-size:8.5px;font-weight:500;color:rgba(27,31,59,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .cal-bar.single-day{background:transparent!important;box-shadow:none;padding:2px 2px;}
  .cal-bar.single-day .cb-line1{color:var(--text);}
  .cal-bar.single-day .cb-line2{color:var(--muted);margin-left:10px;}
  .cal-dot{display:inline-block;width:6px;height:6px;min-width:6px;border-radius:50%;margin-right:4px;}
  .cal-overflow{position:absolute;left:2px;font-size:9.5px;color:var(--muted);font-weight:700;cursor:pointer;pointer-events:auto;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(27,31,59,.45);display:flex;align-items:center;justify-content:center;z-index:50;}
  .overlay[hidden]{display:none;}
  .modal{background:#fff;border-radius:12px;width:520px;max-width:92vw;max-height:88vh;overflow-y:auto;padding:22px 24px;}
  .modal h2{margin:0 0 16px;font-size:17px;color:var(--navy);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px;}
  .field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
  .modal-actions .right{display:flex;gap:8px;}

  .toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:100;opacity:0;transform:translateY(8px);transition:all .2s;}
  .toast.show{opacity:1;transform:translateY(0);}
  .toast.error{background:var(--red);}

  .empty-state{padding:40px;text-align:center;color:var(--muted);font-size:13px;}
  .loading{padding:60px;text-align:center;color:var(--muted);}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Timeless: A Tribute to Classics! — Concert Ops Tracker</h1>
    <div class="sub">Taylor's Symphony Orchestra Annual Concert 2026 &nbsp;•&nbsp; Main Concert 24/10</div>
  </div>
  <div class="top-actions">
    <button class="identity-pill" id="identityBtn"><span class="dot"></span><span id="identityLabel">Set your name</span></button>
    <span class="sync-note" id="syncNote">Loading…</span>
    <button class="btn btn-ghost" id="refreshBtn">↻ Refresh</button>
    <button class="btn btn-gold" id="addTaskBtn">+ Add Task</button>
  </div>
</header>

<nav class="tabs">
  <button class="active" data-tab="tasks">Tasks</button>
  <button data-tab="timeline">Master Timeline</button>
</nav>

<main>
  <div id="tasksView">
    <div class="kpi-row">
      <div class="kpi-card"><div class="num" id="kpiTotal">–</div><div class="lbl">Total Tasks</div></div>
      <div class="kpi-card done"><div class="num" id="kpiDone">–</div><div class="lbl">Completed</div></div>
      <div class="kpi-card soon"><div class="num" id="kpiSoon">–</div><div class="lbl">Due within 7 days</div></div>
      <div class="kpi-card overdue"><div class="num" id="kpiOverdue">–</div><div class="lbl">Overdue</div></div>
    </div>

    <div class="filter-bar">
      <div class="filter-group">
        <label>PIC</label>
        <select id="filterPic"><option value="">All</option></select>
      </div>
      <div class="filter-group">
        <label>Status</label>
        <select id="filterStatus">
          <option value="">All</option>
          <option>Not Started</option><option>In Progress</option><option>Under Review</option><option>Completed</option>
        </select>
      </div>
      <div class="filter-group">
        <label>From</label>
        <input type="date" id="filterFrom">
      </div>
      <div class="filter-group">
        <label>To</label>
        <input type="date" id="filterTo">
      </div>
      <button class="btn btn-outline" id="clearFiltersBtn">Clear</button>
      <div class="filter-count" id="filterCount"></div>
    </div>

    <div id="deptSections"><div class="loading">Loading tasks…</div></div>
  </div>

  <div id="timelineView" style="display:none;">
    <div class="cal-toolbar">
      <button class="cal-nav-btn" id="calPrev">‹</button>
      <div class="cal-month-label" id="calMonthLabel">—</div>
      <button class="cal-nav-btn" id="calNext">›</button>
      <button class="btn btn-outline" id="calTodayBtn">Today</button>
    </div>
    <div class="timeline-legend" id="timelineLegend"></div>
    <div class="cal-grid" id="calGrid"><div class="loading">Loading calendar…</div></div>
  </div>
</main>

<div class="overlay" id="modalOverlay" hidden>
  <div class="modal">
    <h2 id="modalTitle">Add Task</h2>
    <form id="taskForm">
      <div class="field-row">
        <div class="field">
          <label>Department</label>
          <select id="f_dept" required></select>
        </div>
        <div class="field">
          <label>Tag Type</label>
          <select id="f_tag" required>
            <option>Deadline</option><option>Set Up On</option><option>Send Out</option>
            <option>Close On</option><option>Execution Date</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Task</label>
        <input type="text" id="f_task" required placeholder="e.g. Book Bandcamp ADP classroom">
      </div>
      <div class="field-row">
        <div class="field">
          <label>PIC</label>
          <input type="text" id="f_pic" required placeholder="e.g. Bernard, Zhan Hong">
        </div>
        <div class="field">
          <label>Overseer</label>
          <input type="text" id="f_overseer" placeholder="Joshua / Victor">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Start Date</label>
          <input type="date" id="f_start" required>
        </div>
        <div class="field">
          <label>End Date</label>
          <input type="date" id="f_end" required>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Status</label>
          <select id="f_status">
            <option>Not Started</option><option>In Progress</option><option>Under Review</option><option>Completed</option>
          </select>
        </div>
        <div class="field">
          <label>Reminder Date (optional)</label>
          <input type="date" id="f_reminder">
        </div>
      </div>
      <div class="field">
        <label>Notes</label>
        <textarea id="f_notes" rows="2" placeholder="Optional notes or link"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="deleteBtn" style="display:none;">Delete Task</button>
        <div class="right">
          <button type="button" class="btn btn-outline" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-gold">Save</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // ---------------- CONFIG ----------------
  const API_URL = "https://script.google.com/macros/s/AKfycbwk4dqSNMA870qYGLSlKYJk05hHSenjH0bRR_KXtc0M11qgVYB4haVP91m_6vzouEu1xw/exec";
  const REFRESH_MS = 25000;

  const DEPTS = [
    { name: "EXCO", color: "#D9D2E9" },
    { name: "Score Arrangers", color: "#FCE5CD" },
    { name: "Logistics", color: "#D0E0E3" },
    { name: "Design", color: "#F4CCCC" },
    { name: "Sponsorship", color: "#FFE599" },
    { name: "Ticketing", color: "#C9DAF8" },
    { name: "Marketing", color: "#D9EAD3" },
    { name: "Welfare / F&B", color: "#EAD1DC" },
    { name: "PD", color: "#CFE2F3" },
    { name: "CP", color: "#F9CB9C" },
    { name: "FM & SM", color: "#B6D7A8" },
    { name: "PA / Technical", color: "#A2C4C9" },
    { name: "Key Events", color: "#FFD966" },
  ];
  const deptColor = (name) => (DEPTS.find(d => d.name === name) || {}).color || "#E5E3DC";

  // ---------------- STATE ----------------
  let tasks = [];
  let collapsedDepts = new Set();
  let editingId = null;
  let refreshTimer = null;
  let calCursor = new Date(); calCursor.setDate(1); // first-of-month cursor for the calendar tab

  // ---------------- HELPERS ----------------
  function toast(msg, isError){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast show" + (isError ? " error" : "");
    setTimeout(() => t.className = "toast", 2500);
  }

  function todayStr(){
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  function parseDateOnly(s){
    if (!s) return null;
    const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return null;
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return isNaN(d.getTime()) ? null : d;
  }

  function daysBetween(a, b){
    return Math.round((b - a) / 86400000);
  }

  function fmtDate(s){
    const d = parseDateOnly(s);
    if (!d) return "—";
    return d.toLocaleDateString("en-GB", { day:"2-digit", month:"2-digit" });
  }

  function fmtDateRange(startS, endS){
    if (startS && endS && startS === endS) return fmtDate(startS);
    const s = parseDateOnly(startS), e = parseDateOnly(endS);
    if (s && e && s.getTime() === e.getTime()) return fmtDate(startS);
    return fmtDate(startS) + " – " + fmtDate(endS);
  }

  function statusClass(s){
    return "st-" + String(s || "Not Started").replace(/ /g, "_");
  }

  // ---------------- IDENTITY (lightweight, client-side only) ----------------
  function getIdentity(){ return (localStorage.getItem("tracker_identity") || "").trim(); }
  function setIdentity(name){ localStorage.setItem("tracker_identity", name.trim()); renderIdentity(); }
  function renderIdentity(){
    const name = getIdentity();
    document.getElementById("identityLabel").textContent = name ? ("Browsing as: " + name) : "Set your name";
  }
  function isOverseerMatch(identity, overseerField){
    if (!identity || !overseerField) return false;
    const id = identity.toLowerCase();
    // Overseer field can be "Joshua", "Joshua / Victor / Yoyo / Sean", "TBC (rec. Joshua)", "Self", etc.
    return overseerField.toLowerCase().split(/[\/,()]/).map(s => s.trim()).some(part => part && (part === id || part.includes(id)));
  }

  // ---------------- API ----------------
  async function apiGet(){
    const res = await fetch(API_URL + "?action=list");
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "Failed to load tasks");
    return json.tasks;
  }

  async function apiPost(body){
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight on Apps Script
      body: JSON.stringify(body),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "Request failed");
    return json;
  }

  async function loadTasks(showLoading){
    try {
      if (showLoading) document.getElementById("deptSections").innerHTML = '<div class="loading">Loading tasks…</div>';
      tasks = await apiGet();
      document.getElementById("syncNote").textContent = "Synced " + new Date().toLocaleTimeString();
      populatePicFilter();
      renderAll();
    } catch (err) {
      document.getElementById("syncNote").textContent = "Sync failed";
      toast("Couldn't load tasks: " + err.message, true);
    }
  }

  function scheduleRefresh(){
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(() => loadTasks(false), REFRESH_MS);
  }

  // ---------------- FILTERS ----------------
  function populatePicFilter(){
    const sel = document.getElementById("filterPic");
    const current = sel.value;
    const names = new Set();
    tasks.forEach(t => String(t.PIC || "").split(",").map(s => s.trim()).forEach(n => { if (n) names.add(n); }));
    const sorted = Array.from(names).sort((a,b) => a.localeCompare(b));
    sel.innerHTML = '<option value="">All</option>' + sorted.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join("");
    if (sorted.includes(current)) sel.value = current;
  }

  function getFilteredTasks(){
    const pic = document.getElementById("filterPic").value;
    const status = document.getElementById("filterStatus").value;
    const from = document.getElementById("filterFrom").value;
    const to = document.getElementById("filterTo").value;

    return tasks.filter(t => {
      if (pic && !String(t.PIC || "").split(",").map(s => s.trim()).includes(pic)) return false;
      if (status && t.Status !== status) return false;
      if (from || to) {
        const s = parseDateOnly(t["Start Date"]), e = parseDateOnly(t["End Date"]);
        if (!s || !e) return false;
        if (from && e < parseDateOnly(from)) return false;
        if (to && s > parseDateOnly(to)) return false;
      }
      return true;
    });
  }

  // ---------------- RENDER: TASKS TAB ----------------
  function renderKPIs(list){
    const today = parseDateOnly(todayStr());
    const total = list.length;
    const done = list.filter(t => t.Status === "Completed").length;
    const overdue = list.filter(t => t.Status !== "Completed" && parseDateOnly(t["End Date"]) < today).length;
    const soon = list.filter(t => {
      if (t.Status === "Completed") return false;
      const end = parseDateOnly(t["End Date"]);
      if (!end) return false;
      const diff = daysBetween(today, end);
      return diff >= 0 && diff <= 7;
    }).length;
    document.getElementById("kpiTotal").textContent = total;
    document.getElementById("kpiDone").textContent = done;
    document.getElementById("kpiSoon").textContent = soon;
    document.getElementById("kpiOverdue").textContent = overdue;
  }

  function renderDeptSections(list){
    const container = document.getElementById("deptSections");
    document.getElementById("filterCount").textContent = list.length + " of " + tasks.length + " tasks shown";

    if (list.length === 0) {
      container.innerHTML = tasks.length === 0
        ? '<div class="empty-state">No tasks yet. Click "+ Add Task" to create the first one.</div>'
        : '<div class="empty-state">No tasks match the current filters.</div>';
      return;
    }
    const today = parseDateOnly(todayStr());
    const grouped = {};
    list.forEach(t => {
      const dept = t.Department || "Uncategorized";
      (grouped[dept] = grouped[dept] || []).push(t);
    });
    const order = DEPTS.map(d => d.name).concat(Object.keys(grouped).filter(d => !DEPTS.some(x => x.name === d)));

    let html = "";
    order.forEach(dept => {
      const deptList = grouped[dept];
      if (!deptList) return;
      deptList.sort((a,b) => (a.PIC||"").localeCompare(b.PIC||"") || String(a["Start Date"]||"").localeCompare(String(b["Start Date"]||"")));
      const doneCount = deptList.filter(t => t.Status === "Completed").length;
      const pct = Math.round((doneCount / deptList.length) * 100);
      const collapsed = collapsedDepts.has(dept) ? " collapsed" : "";
      const color = deptColor(dept);

      html += `<div class="dept-section${collapsed}" data-dept="${escapeAttr(dept)}">
        <div class="dept-head" style="background:${color}22;" onclick="TRACKER.toggleDept('${escapeAttr(dept)}')">
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="dept-caret">▾</span>
            <span class="dept-name">${escapeHtml(dept)}</span>
            <span class="dept-count">${deptList.length} task${deptList.length===1?"":"s"}</span>
          </div>
          <div class="dept-progress-wrap">
            <div class="dept-progress-bar"><div class="dept-progress-fill" style="width:${pct}%;"></div></div>
            <div class="dept-progress-pct">${pct}%</div>
          </div>
        </div>
        <div class="dept-body">
          <table class="task-table">
            <thead><tr>
              <th>Task</th><th>PIC</th><th>Dates</th><th>Status</th><th></th>
            </tr></thead>
            <tbody>`;

      deptList.forEach(t => {
        const end = parseDateOnly(t["End Date"]);
        const overdue = t.Status !== "Completed" && end && end < today;
        const diff = end ? daysBetween(today, end) : null;
        const soon = t.Status !== "Completed" && diff !== null && diff >= 0 && diff <= 3;
        const rowClass = overdue ? "overdue" : (soon ? "soon" : "");
        let flag = "";
        if (overdue) flag = `<span class="date-flag overdue">OVERDUE</span>`;
        else if (soon) flag = `<span class="date-flag soon">DUE SOON</span>`;

        const identity = getIdentity();
        const isUnderReview = t.Status === "Under Review";
        const canComplete = !isUnderReview || isOverseerMatch(identity, t.Overseer || "");
        const overseerNote = isUnderReview
          ? `<div class="overseer-note">Overseer: <b>${escapeHtml(t.Overseer || "—")}</b></div>`
          : "";

        html += `<tr class="${rowClass}">
          <td class="task-cell">
            <div class="task-name">${escapeHtml(t.Task || "")}</div>
            <div class="task-tag">${escapeHtml(t["Tag Type"] || "")}</div>
          </td>
          <td class="pic-cell">${escapeHtml(t.PIC || "")}${overseerNote}</td>
          <td class="date-range">${fmtDateRange(t["Start Date"], t["End Date"])}${flag}</td>
          <td>
            <select class="status-pill ${statusClass(t.Status)}" onchange="TRACKER.quickStatus('${escapeAttr(t.ID)}', this.value, this)">
              ${["Not Started","In Progress","Under Review","Completed"].map(s => {
                const disabled = (s === "Completed" && isUnderReview && !canComplete) ? "disabled" : "";
                const title = disabled ? `title="Only ${escapeAttr(t.Overseer||'the overseer')} can mark this Completed"` : "";
                return `<option value="${s}" ${t.Status===s?"selected":""} ${disabled} ${title}>${s}</option>`;
              }).join("")}
            </select>
          </td>
          <td>
            <div class="row-actions">
              <button class="icon-btn" title="Edit" onclick="TRACKER.openEdit('${escapeAttr(t.ID)}')">✎</button>
            </div>
          </td>
        </tr>`;
      });

      html += `</tbody></table></div></div>`;
    });

    container.innerHTML = html;
  }

  function renderAll(){
    const filtered = getFilteredTasks();
    renderKPIs(filtered);
    renderDeptSections(filtered);
    renderCalendar();
  }

  // ---------------- RENDER: MASTER TIMELINE (CALENDAR) ----------------
  function renderCalendar(){
    const grid = document.getElementById("calGrid");
    const legend = document.getElementById("timelineLegend");
    legend.innerHTML = DEPTS.map(d =>
      `<span class="legend-chip"><span class="legend-swatch" style="background:${d.color};"></span>${escapeHtml(d.name)}</span>`
    ).join("");

    const list = getFilteredTasks();
    document.getElementById("calMonthLabel").textContent = calCursor.toLocaleDateString("en-GB", { month: "long", year: "numeric" });

    if (list.length === 0) {
      grid.innerHTML = '<div class="empty-state">No tasks to show on the calendar.</div>';
      return;
    }

    const year = calCursor.getFullYear(), month = calCursor.getMonth();
    const firstOfMonth = new Date(year, month, 1);
    const startWeekday = (firstOfMonth.getDay() + 6) % 7; // Monday = 0
    const gridStart = new Date(year, month, 1 - startWeekday);
    const daysInGrid = 42; // 6 weeks, always enough to cover any month
    const todayD = parseDateOnly(todayStr());

    let html = `<div class="cal-weekday-row">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div>${d}</div>`).join("")}</div>`;

    for (let w = 0; w < 6; w++) {
      const weekStart = new Date(gridStart); weekStart.setDate(weekStart.getDate() + w*7);
      const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate() + 6);

      // tasks intersecting this week
      const weekTasks = list.filter(t => {
        const s = parseDateOnly(t["Start Date"]), e = parseDateOnly(t["End Date"]);
        return s && e && s <= weekEnd && e >= weekStart;
      }).sort((a,b) => (parseDateOnly(a["Start Date"]) - parseDateOnly(b["Start Date"])) || (parseDateOnly(b["End Date"]) - parseDateOnly(b["Start Date"])) - (parseDateOnly(a["End Date"]) - parseDateOnly(a["Start Date"])));

      // greedy lane assignment
      const LANE_HEIGHT = 32; // px per lane, tall enough for the two-line "Tag: Task / PIC" bars
      const MAX_LANES = 2;
      const lanes = []; // each lane: last occupied end-col index
      const placed = [];
      const overflowPerDay = new Array(7).fill(0);

      weekTasks.forEach(t => {
        const s = parseDateOnly(t["Start Date"]), e = parseDateOnly(t["End Date"]);
        const isSingleDay = s && e && s.getTime() === e.getTime();
        const colStart = Math.max(0, daysBetween(weekStart, s));
        const colEnd = Math.min(6, daysBetween(weekStart, e));
        let lane = -1;
        for (let l = 0; l < lanes.length; l++) {
          if (lanes[l] < colStart) { lane = l; break; }
        }
        if (lane === -1 && lanes.length < MAX_LANES) { lane = lanes.length; lanes.push(-1); }
        if (lane === -1) {
          for (let c = colStart; c <= colEnd; c++) overflowPerDay[c]++;
          return;
        }
        lanes[lane] = colEnd;
        placed.push({ t, colStart, colEnd, lane, isSingleDay });
      });

      let dayCellsHtml = "";
      for (let d = 0; d < 7; d++) {
        const day = new Date(weekStart); day.setDate(day.getDate() + d);
        const inMonth = day.getMonth() === month;
        const isToday = todayD && day.getTime() === todayD.getTime();
        dayCellsHtml += `<div class="cal-day${inMonth?"":" other-month"}${isToday?" today":""}">
          <span class="cal-daynum">${day.getDate()}</span>
        </div>`;
      }

      let barsHtml = "";
      placed.forEach(p => {
        const left = (p.colStart / 7) * 100;
        const width = ((p.colEnd - p.colStart + 1) / 7) * 100;
        const color = deptColor(p.t.Department);
        const cls = "cal-bar" + (p.isSingleDay ? " single-day" : "");
        const bg = p.isSingleDay ? "" : `background:${color};`;
        const tagType = p.t["Tag Type"] || "";
        const line1Text = (tagType ? tagType + ": " : "") + (p.t.Task || "");
        const dot = p.isSingleDay ? `<span class="cal-dot" style="background:${color};"></span>` : "";
        const inner = `<span class="cb-line1">${dot}${escapeHtml(line1Text)}</span><span class="cb-line2">${escapeHtml(p.t.PIC || "")}</span>`;
        const tip = p.isSingleDay
          ? (p.t.Department + ' — ' + line1Text + ' (deadline: ' + fmtDate(p.t['Start Date']) + ') — ' + (p.t.PIC || ''))
          : (p.t.Department + ' — ' + line1Text + ' (' + fmtDateRange(p.t['Start Date'], p.t['End Date']) + ') — ' + (p.t.PIC || ''));
        barsHtml += `<div class="${cls}" style="left:${left}%;width:calc(${width}% - 3px);top:${p.lane*LANE_HEIGHT}px;${bg}" onclick="TRACKER.openEdit('${escapeAttr(p.t.ID)}')" title="${escapeAttr(tip)}">${inner}</div>`;
      });
      const maxOverflow = Math.max(0, ...overflowPerDay);
      if (maxOverflow > 0) {
        barsHtml += `<div class="cal-overflow" style="top:${MAX_LANES*LANE_HEIGHT}px;left:2px;">+${maxOverflow} more this week</div>`;
      }

      html += `<div class="cal-week">${dayCellsHtml}<div class="cal-bars-overlay">${barsHtml}</div></div>`;
    }

    grid.innerHTML = html;
  }

  // ---------------- ACTIONS ----------------
  window.TRACKER = {
    toggleDept(dept){
      if (collapsedDepts.has(dept)) collapsedDepts.delete(dept); else collapsedDepts.add(dept);
      renderDeptSections(getFilteredTasks());
    },
    async quickStatus(id, newStatus, selectEl){
      const t = tasks.find(x => x.ID === id);
      if (t && t.Status === "Under Review" && newStatus === "Completed" && !isOverseerMatch(getIdentity(), t.Overseer || "")) {
        toast("Only " + (t.Overseer || "the overseer") + " can mark this Completed.", true);
        selectEl.value = t.Status;
        return;
      }
      selectEl.className = "status-pill " + statusClass(newStatus);
      try {
        await apiPost({ action: "update", id, task: { Status: newStatus } });
        if (t) t.Status = newStatus;
        renderAll();
        toast("Status updated");
      } catch (err) {
        toast("Update failed: " + err.message, true);
        loadTasks(false);
      }
    },
    openEdit(id){
      const t = tasks.find(x => x.ID === id);
      if (!t) return;
      editingId = id;
      document.getElementById("modalTitle").textContent = "Edit Task";
      document.getElementById("deleteBtn").style.display = "inline-block";
      fillForm(t);
      document.getElementById("modalOverlay").hidden = false;
    },
  };

  function fillForm(t){
    document.getElementById("f_dept").value = t.Department || DEPTS[0].name;
    document.getElementById("f_tag").value = t["Tag Type"] || "Deadline";
    document.getElementById("f_task").value = t.Task || "";
    document.getElementById("f_pic").value = t.PIC || "";
    document.getElementById("f_overseer").value = t.Overseer || "";
    document.getElementById("f_start").value = (t["Start Date"]||"").slice(0,10);
    document.getElementById("f_end").value = (t["End Date"]||"").slice(0,10);
    document.getElementById("f_status").value = t.Status || "Not Started";
    document.getElementById("f_reminder").value = (t["Reminder Date"]||"").slice(0,10);
    document.getElementById("f_notes").value = t.Notes || "";
  }

  function resetForm(){
    editingId = null;
    document.getElementById("taskForm").reset();
    document.getElementById("f_dept").value = DEPTS[0].name;
    document.getElementById("modalTitle").textContent = "Add Task";
    document.getElementById("deleteBtn").style.display = "none";
  }

  function readForm(){
    return {
      Department: document.getElementById("f_dept").value,
      "Tag Type": document.getElementById("f_tag").value,
      Task: document.getElementById("f_task").value.trim(),
      PIC: document.getElementById("f_pic").value.trim(),
      Overseer: document.getElementById("f_overseer").value.trim(),
      "Start Date": document.getElementById("f_start").value,
      "End Date": document.getElementById("f_end").value,
      Status: document.getElementById("f_status").value,
      "Reminder Date": document.getElementById("f_reminder").value,
      Notes: document.getElementById("f_notes").value.trim(),
    };
  }

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }
  function escapeAttr(s){ return escapeHtml(s).replace(/`/g, "&#96;"); }

  // ---------------- WIRE UP UI ----------------
  document.querySelectorAll("nav.tabs button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const tab = btn.dataset.tab;
      document.getElementById("tasksView").style.display = tab === "tasks" ? "" : "none";
      document.getElementById("timelineView").style.display = tab === "timeline" ? "" : "none";
      if (tab === "timeline") renderCalendar();
    });
  });

  document.getElementById("refreshBtn").addEventListener("click", () => loadTasks(true));
  document.getElementById("addTaskBtn").addEventListener("click", () => {
    resetForm();
    document.getElementById("modalOverlay").hidden = false;
  });
  document.getElementById("cancelBtn").addEventListener("click", () => {
    document.getElementById("modalOverlay").hidden = true;
  });
  document.getElementById("modalOverlay").addEventListener("click", (e) => {
    if (e.target.id === "modalOverlay") document.getElementById("modalOverlay").hidden = true;
  });

  document.getElementById("identityBtn").addEventListener("click", () => {
    const name = prompt("What's your name? (Used to check who's allowed to mark 'Under Review' tasks as Completed.)", getIdentity());
    if (name !== null) { setIdentity(name); renderAll(); }
  });

  ["filterPic","filterStatus","filterFrom","filterTo"].forEach(id => {
    document.getElementById(id).addEventListener("change", renderAll);
  });
  document.getElementById("clearFiltersBtn").addEventListener("click", () => {
    document.getElementById("filterPic").value = "";
    document.getElementById("filterStatus").value = "";
    document.getElementById("filterFrom").value = "";
    document.getElementById("filterTo").value = "";
    renderAll();
  });

  document.getElementById("calPrev").addEventListener("click", () => {
    calCursor.setMonth(calCursor.getMonth() - 1);
    renderCalendar();
  });
  document.getElementById("calNext").addEventListener("click", () => {
    calCursor.setMonth(calCursor.getMonth() + 1);
    renderCalendar();
  });
  document.getElementById("calTodayBtn").addEventListener("click", () => {
    calCursor = new Date(); calCursor.setDate(1);
    renderCalendar();
  });

  document.getElementById("taskForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = readForm();
    try {
      if (editingId) {
        await apiPost({ action: "update", id: editingId, task: data });
        toast("Task updated");
      } else {
        await apiPost({ action: "add", task: data });
        toast("Task added");
      }
      document.getElementById("modalOverlay").hidden = true;
      await loadTasks(false);
    } catch (err) {
      toast("Save failed: " + err.message, true);
    }
  });

  document.getElementById("deleteBtn").addEventListener("click", async () => {
    if (!editingId) return;
    if (!confirm("Delete this task? This cannot be undone.")) return;
    try {
      await apiPost({ action: "delete", id: editingId });
      toast("Task deleted");
      document.getElementById("modalOverlay").hidden = true;
      await loadTasks(false);
    } catch (err) {
      toast("Delete failed: " + err.message, true);
    }
  });

  // populate department dropdown
  const deptSelect = document.getElementById("f_dept");
  deptSelect.innerHTML = DEPTS.map(d => `<option value="${d.name}">${d.name}</option>`).join("");

  // ---------------- INIT ----------------
  renderIdentity();
  loadTasks(true);
  scheduleRefresh();
})();
</script>
</body>
</html>
